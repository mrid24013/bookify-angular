<div class="explore-page">
    <h2>Gestión de Espacios y Disponibilidad</h2>
  
    <div class="card-form">
      <form [formGroup]="espacioForm" (ngSubmit)="onSubmit()">
        <div class="form-row">
          <div class="field">
            <label for="nombre">Nombre del Espacio</label>
            <input id="nombre" type="text" formControlName="nombre" placeholder="Ej: Sala A" />
          </div>
  
          <div class="field">
            <label for="capacidad">Capacidad</label>
            <input id="capacidad" type="number" formControlName="capacidad" min="1" />
          </div>
        </div>
  
        <div class="field">
          <label for="descripcion">Descripcion</label>
          <textarea id="descripcion" rows="2" formControlName="descripcion"></textarea>
        </div>
  
        <div class="field-checkbox">
          <input id="activo" type="checkbox" formControlName="activo" />
          <label for="activo">Espacio Habilitado</label>
        </div>
  
        <div class="actions">
          <button type="submit" [disabled]="espacioForm.invalid" class="btn-primary">
            {{ isEditing ? 'Actualizar Espacio' : 'Guardar Espacio' }}
          </button>
          @if (isEditing) {
            <button type="button" (click)="resetForm()" class="btn-secondary">Cancelar</button>
          }
        </div>
      </form>
    </div>
  
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Descripcion</th>
            <th>Capacidad</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (item of espacios; track item.id) {
            <tr>
              <td><strong>{{ item.nombre }}</strong></td>
              <td>{{ item.descripcion || 'Sin descripcion' }}</td>
              <td>{{ item.capacidad }} pers.</td>
              <td>
                <span [class]="item.activo ? 'badge active' : 'badge inactive'">
                  {{ item.activo ? 'ACTIVO' : 'INACTIVO' }}
                </span>
              </td>
              <td>
                <button (click)="onEdit(item)" class="btn-edit">Editar</button>
                <button (click)="onDelete(item.id)" class="btn-delete">Borrar</button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
