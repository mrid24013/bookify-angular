services:
  bookify:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - '4200:4200'

    volumes:
      - .:/app
      - /app/node_modules

  #environment agregado para solucionar inestabilidad con la inicializacion del contenedor 
  # y la funcionalidad de ver los cambios en tiempo real.
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      
    stdin_open: true
    tty: true
